[package]
name = "cars"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log", "bevy_winit",
    "bevy_core_pipeline", "bevy_sprite_render", "bevy_gizmos_render", "bevy_post_process", "x11",
    "bevy_text", "default_font", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "ui_picking", "png",
] }
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_math = { version = "0.20.0", default-features = false, features = ["std"] }
webbrowser = "1.2.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["web", "webgl2"] }

[features]
# Native Wayland backend; needs libwayland-dev and libxkbcommon-dev to build.
wayland = ["bevy/wayland"]
